<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var path = location.pathname || "/";
      if (!path.endsWith("/")) {
        var last = path.slice(path.lastIndexOf("/") + 1);
        if (last.indexOf(".") >= 0) path = path.slice(0, path.lastIndexOf("/") + 1);
        else path += "/";
      }
      var base = document.createElement("base");
      base.href = path;
      document.head.appendChild(base);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181c">
  <meta name="description" content="一家人一起学英语：车上听，在家打。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="听背打">
  <meta name="format-detection" content="telephone=no">
  <title>听背打</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app"></div>
  <audio id="player" preload="none"></audio>
  <div id="toast" class="toast"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
